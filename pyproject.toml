[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["leaderboard"]

[tool.setuptools.package-data]
leaderboard = ["static/*.html"]

[project]
name = "realtime-leaderboard-redis"
version = "1.0.0"
description = "Ranking em tempo real com Redis: sorted sets, Lua, pub/sub e rate limit"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "redis>=5.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# o TestClient do Starlette avisa que vai trocar de httpx; não é problema do projeto
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
